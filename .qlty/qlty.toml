config_version = "0"

exclude_patterns = [
  "*_min.*",
  "*-min.*",
  "*.min.*",
  "**/.yarn/**",
  "**/*.d.ts",
  "**/assets/**",
  "**/bower_components/**",
  "**/build/**",
  "**/cache/**",
  "**/config/**",
  "**/db/**",
  "**/deps/**",
  "**/dist/**",
  "**/extern/**",
  "**/external/**",
  "**/generated/**",
  "**/Godeps/**",
  "**/gradlew/**",
  "**/mvnw/**",
  "**/node_modules/**",
  "**/protos/**",
  "**/seed/**",
  "**/target/**",
  "**/templates/**",
  "**/testdata/**",
  "**/vendor/**",
]

test_patterns = [
  "**/test/**",
  "**/spec/**",
  "**/*.test.*",
  "**/*.spec.*",
  "**/*_test.*",
  "**/*_spec.*",
  "**/test_*.*",
  "**/spec_*.*",
]

[smells]
mode = "comment"

[[source]]
name = "default"
default = true


[[plugin]]
name = "actionlint"

[[plugin]]
name = "editorconfig-checker"
mode = "comment"

[[plugin]]
name = "eslint"
package_file = "package.json"
package_filters = ["eslint", "prettier", "@electron-toolkit/eslint-config", "@electron-toolkit/eslint-config-prettier", "eslint-plugin-svelte", "svelte", "prettier-plugin-svelte"]

[[plugin]]
name = "prettier"
package_file = "package.json"
package_filters = ["prettier"]

[[plugin]]
name = "osv-scanner"

[[plugin]]
name = "ripgrep"
mode = "comment"

[[plugin]]
name = "trufflehog"

[[plugin]]
name = "zizmor"

# Baseline: legacy docs/config formatting and the existing release workflow.
# Findings are tracked as separate hardening work, not fixed in this PR.
[[exclude]]
plugins = ["prettier"]
file_patterns = [".claude/**", ".github/**", ".vscode/**", "docs/**", "site/**", "*.md", "*.yml", "*.json"]

[[exclude]]
plugins = ["zizmor"]
file_patterns = [".github/workflows/release.yml"]

[[exclude]]
plugins = ["editorconfig-checker"]
file_patterns = [".github/**", "docs/**", "*.md"]
