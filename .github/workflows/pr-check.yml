name: PR Checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: '0'
  NO_COLOR: '1'

jobs:
  ci:
    name: Build and Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint:check
      - name: Production build
        if: ${{ !cancelled() }}
        run: bun run build

  qlty:
    name: Qlty Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      details: ${{ steps.details.outputs.text }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: qltysh/qlty-action/install@ebcd284bf32e36a030afe15f1e136c7be08b9506 # v2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      # ESLint inside Qlty resolves plugins imported by eslint.config.js from the project.
      - name: Install dependencies for ESLint plugins
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Validate Qlty config
        run: |
          test -f .qlty/qlty.toml || { echo 'Run qlty init locally and commit .qlty/qlty.toml first.'; exit 1; }
          qlty config validate
          mkdir -p reports
      - name: Qlty check
        id: check
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          qlty check --all --no-fix --no-progress --fail-level fmt 2>&1 | tee reports/check.txt
      - name: Qlty smells
        id: smells
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          qlty smells --all --no-snippets 2>&1 | tee reports/smells.txt
      - name: Qlty metrics
        id: metrics
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          qlty metrics --all --max-depth=2 --sort complexity 2>&1 | tee reports/metrics.txt
      - name: Prepare compact report
        id: details
        if: ${{ always() }}
        shell: python
        run: |
          import html, os, pathlib, re, uuid
          sections = []
          for name in ('check', 'smells', 'metrics'):
              path = pathlib.Path('reports') / (name + '.txt')
              text = path.read_text(errors='replace') if path.exists() else 'No output: check setup and job logs.'
              text = re.sub(r'\x1b\[[0-9;]*[A-Za-z]', '', text)
              text = ''.join(c for c in text if c in '\n\t' or ord(c) >= 32)
              # HTML-escape tool output; prevent mentions, Markdown or details injection.
              text = html.escape(text[:3500]).replace('@', '&#64;')
              if path.exists() and path.stat().st_size > 3500:
                  text += '\n… truncated; download the full artifact.'
              sections.append('<details><summary>Qlty ' + name + '</summary><pre>' + text + '</pre></details>')
          report = '\n\n'.join(sections)
          delimiter = 'REPORT_' + uuid.uuid4().hex
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('text<<' + delimiter + '\n' + report + '\n' + delimiter + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## 💎 Qlty Analysis\n\n' + report)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ always() }}
        with:
          name: qlty-reports
          path: reports/
          retention-days: 14
          if-no-files-found: warn
      - name: Enforce Qlty execution and lint result
        if: ${{ always() }}
        env:
          CHECK_RESULT: ${{ steps.check.outcome }}
          SMELLS_RESULT: ${{ steps.smells.outcome }}
          METRICS_RESULT: ${{ steps.metrics.outcome }}
        run: |
          test "$CHECK_RESULT" = success
          test "$SMELLS_RESULT" = success
          test "$METRICS_RESULT" = success
          # Smells and metrics are informational: no numeric threshold assumed.

  gate:
    name: PR Gate
    if: ${{ always() }}
    needs: [ci, qlty]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all checks to pass
        env:
          CI: ${{ needs.ci.result }}
          QLTY: ${{ needs.qlty.result }}
        run: |
          test "$CI" = success
          test "$QLTY" = success

  report:
    name: PR Report
    if: ${{ always() }}
    needs: [ci, qlty, gate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      # No checkout or execution of PR scripts in this job.
      - name: Compose dashboard
        id: dashboard
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          RESULTS: ${{ toJSON(needs) }}
          QLTY_DETAILS: ${{ needs.qlty.outputs.details }}
        with:
          script: |
            const fs = require('fs');
            const results = JSON.parse(process.env.RESULTS);
            const symbols = {success:'✅ Passed', failure:'❌ Failed', cancelled:'⏹ Cancelled', skipped:'➖ Skipped'};
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const sha = context.payload.pull_request?.head.sha || context.sha;
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {...context.repo, run_id:context.runId, per_page:100});
            const definitions = [['ci','Build and Tests'], ['qlty','Qlty Analysis']];
            let body = `## 💎 PR Quality · Qlty\n\n**${results.gate.result === 'success' ? '✅ CI checks passed' : '❌ CI checks need attention'}** · Commit \`${sha.slice(0,7)}\` · [Run #${context.runNumber}](${runUrl})\n\n`;
            body += '| Check | Result | Details |\n|:--|:--|:--|\n';
            for (const [key,name] of definitions) {
              const job = jobs.find(j => j.name === name);
              body += `| ${name} | ${symbols[results[key].result] || results[key].result} | [Logs](${job?.html_url || runUrl}) |\n`;
            }
            body += '\n<details><summary>Build and test steps</summary>\n\n';
            body += '| Step | Result |\n|:--|:--|\n';
            for (const step of jobs.find(j => j.name === 'Build and Tests')?.steps || []) {
              body += `| ${step.name.replaceAll('|','/')} | ${symbols[step.conclusion] || step.status} |\n`;
            }
            body += '\n</details>\n\n';
            body += '| Qlty command | Execution | Policy |\n|:--|:--|:--|\n';
            for (const command of ['check','smells','metrics']) {
              const step = jobs.find(j => j.name === 'Qlty Analysis')?.steps?.find(s => s.name === `Qlty ${command}`);
              // continue-on-error steps can have a success conclusion despite failure:
              // the Qlty job's final enforcement step is authoritative for PR Gate.
              body += `| qlty ${command} | ${step ? 'See output below' : 'No step reported'} | ${command === 'check' ? 'Blocking lint/format' : 'Informational findings; execution errors block'} |\n`;
            }
            body += '\n' + (process.env.QLTY_DETAILS || 'Qlty report unavailable; see logs.') + '\n\n';
            body += `📦 [Full Qlty reports and run summary](${runUrl})\n\n`;
            body += '> Merge requires approval and PR Gate. Qlty check is blocking; smells and metrics findings are informational.\n';
            fs.writeFileSync('pr-report.md', body);
            await core.summary.addRaw(body).write();
      - name: Update sticky PR dashboard
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.id != 49699333 }}
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3
        with:
          header: pr-quality-security-dashboard
          path: pr-report.md
      - name: Explain restricted comment permission
        if: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.user.id == 49699333) }}
        run: echo 'Fork/Dependabot PR uses read-only credentials; dashboard is available in the Actions summary.'
