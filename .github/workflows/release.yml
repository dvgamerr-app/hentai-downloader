name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve version
        id: v
        shell: bash
        run: |
          VERSION=$(grep -m1 '"version"' package.json | sed -E 's/.*"([0-9][^"]*)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version $VERSION"
            exit 1
          fi

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build installer
        run: |
          bun run build
          bunx electron-builder --win --publish never

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists"
            exit 1
          fi
          REMOTE=$(git ls-remote origin "refs/tags/$TAG^{}" | cut -f1)
          if [ -n "$REMOTE" ] && [ "$REMOTE" != "$GITHUB_SHA" ]; then
            echo "::error::Tag $TAG already points at $REMOTE, not $GITHUB_SHA. Delete the stale tag and rerun."
            exit 1
          fi
          gh release create "$TAG" \
            "dist/hentai-downloader-$VERSION-setup.exe" \
            "dist/hentai-downloader-$VERSION-setup.exe.blockmap" \
            dist/latest.yml \
            --target "$GITHUB_SHA" \
            --title "Hentai Downloader $TAG" \
            --generate-notes
